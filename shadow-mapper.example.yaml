# Shadow-API Mapper Configuration
# Copy this file: cp shadow-mapper.example.yaml shadow-mapper.yaml

# ============================================================
# SCOPE — which domains to allow/block
# ============================================================
scope:
  # Domains to allow (wildcards supported)
  # Leave empty = allow all (not recommended)
  allowed_domains:
    - "*.example.com"
    - "api.example.com"

  # Domains to NEVER scan (blocklist takes precedence)
  blocked_domains:
    - "localhost"
    - "127.0.0.1"
    - "0.0.0.0"
    - "*.gov"
    - "*.mil"
    - "*.edu"

# ============================================================
# RATE LIMITING — avoid WAF/DoS triggers
# ============================================================
rate_limit:
  requests_per_second: 10
  burst: 20
  backoff_multiplier: 2.0
  max_backoff_seconds: 60

# ============================================================
# HARVESTER — browser automation settings
# ============================================================
harvester:
  browser_timeout: 30000     # ms — page load timeout
  wait_for_idle: true        # wait for network idle
  extract_source_maps: true  # download .map files
  wayback_months: 24         # months of Wayback history
  max_js_size_mb: 10.0       # skip files larger than this
  headless: true             # run browser headlessly

# ============================================================
# PARSER — static analysis settings
# ============================================================
parser:
  languages:
    - javascript
    - typescript
    - python
  resolve_variables: true       # resolve BASE_URL + "/path"
  max_resolution_depth: 10
  detect_secrets: true

  # Directories to skip during parsing
  ignore_paths:
    - node_modules
    - __pycache__
    - dist
    - build
    - .next
    - .nuxt
    - coverage
    - "*.test.js"
    - "*.spec.ts"

  # Known fake/placeholder values — skip as secrets
  secret_allowlist:
    - "your-api-key-here"
    - "xxxxxxxxxxxx"
    - "placeholder"
    - "changeme"
    - "example_key"
    - "YOUR_SECRET_KEY"
    - "INSERT_KEY_HERE"
    - "your_token_here"

# ============================================================
# PROBER — HTTP verification settings
# ============================================================
prober:
  timeout: 30                # seconds per request
  follow_redirects: true
  max_redirects: 5
  verify_ssl: true
  methods_to_test:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  version_permutations: true  # test /v1/, /v2/ etc.
  max_version: 5
  user_agent: "ShadowMapper/1.0 (+https://github.com/villen/shadow-api-mapper)"

# ============================================================
# AUDITOR — OpenAPI spec comparison
# ============================================================
auditor:
  spec_format: auto          # openapi3, openapi2, auto
  generate_skeleton: true    # generate spec for shadow APIs
  redact_pii: true           # redact PII in reports

# ============================================================
# OUTPUT — report formats and location
# ============================================================
output:
  format: json               # primary: sarif, json, csv, html
  output_dir: ./output
  verbose: false

  # Generate these extra formats alongside primary
  extra_formats:
    - html                   # visual report for browser
    - csv                    # Excel-compatible with risk scoring

# ============================================================
# GLOBAL
# ============================================================
dry_run: false               # true = preview only, no requests
