# Shadow-API Mapper — CI/CD Pipeline
# Runs: lint → tests → build docker → optional scan → diff check

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # weekly on Monday
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for scan (optional)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

jobs:
  # ==========================================
  # Lint & Type Check
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache venv
        id: cached-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src/

      - name: Ruff format check
        run: poetry run ruff format --check src/

      - name: MyPy type check
        run: poetry run mypy src/ --ignore-missing-imports
        continue-on-error: true

  # ==========================================
  # Unit Tests
  # ==========================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache venv
        id: cached-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short --cov=shadow_mapper --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ==========================================
  # Shadow API Diff Check (on PRs)
  # ==========================================
  shadow-diff:
    name: Shadow API Diff Check
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Scan current branch
        run: |
          poetry run shadow-mapper parse ./src \
            --output current-scan.json \
            --secrets \
            --resolve
        continue-on-error: true

      - name: Checkout base branch for baseline
        run: |
          git stash
          git checkout ${{ github.base_ref }}
        continue-on-error: true

      - name: Scan base branch (baseline)
        run: |
          poetry run shadow-mapper parse ./src \
            --output baseline-scan.json \
            --secrets \
            --resolve
        continue-on-error: true

      - name: Restore PR branch
        run: |
          git checkout ${{ github.head_ref }} 2>/dev/null || \
          git checkout -
        continue-on-error: true

      - name: Run diff check
        run: |
          if [ -f baseline-scan.json ] && [ -f current-scan.json ]; then
            poetry run shadow-mapper diff \
              baseline-scan.json current-scan.json \
              --output diff-report.json \
              --no-fail
          else
            echo "Skipping diff — baseline or current scan missing"
          fi
        continue-on-error: true

      - name: Upload diff report
        uses: actions/upload-artifact@v4
        with:
          name: shadow-api-diff-${{ github.run_number }}
          path: |
            diff-report.json
            current-scan.json
            baseline-scan.json
        if: always()

  # ==========================================
  # Build Docker Image
  # ==========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Optional: Full API Scan (manual trigger)
  # ==========================================
  scan:
    name: API Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install project
        run: poetry install --no-interaction

      - name: Install Playwright
        run: poetry run playwright install chromium

      - name: Validate target URL
        id: validate
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [[ ! "$TARGET" =~ ^https?:// ]]; then
            echo "::error::Invalid URL scheme. Only http:// and https:// allowed."
            exit 1
          fi
          if [[ "$TARGET" =~ [\;\|\&\$\`\(\)\{\}\<\>\!\#] ]]; then
            echo "::error::URL contains invalid characters."
            exit 1
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Run Shadow-API Mapper
        env:
          SCAN_TARGET: ${{ steps.validate.outputs.target }}
        run: |
          poetry run shadow-mapper scan "$SCAN_TARGET" \
            --output ./scan-output \
            --sarif results.sarif \
            --skip-wayback

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        if: always()

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scan-output/
        if: always()

  # ==========================================
  # Release (on version tags)
  # ==========================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Build package
        run: poetry build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
